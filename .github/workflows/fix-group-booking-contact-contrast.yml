name: Fix group booking and contact contrast
on:
  push:
    paths:
      - '.github/workflows/fix-group-booking-contact-contrast.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair group booking section
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('group-coaching.html')
          s = p.read_text()

          # Add the missing on-site Cal booking section before the enquiry form.
          if 'id="group-booking"' not in s:
              section = r'''
<section class="group-booking" id="group-booking">
  <div class="wrap">
    <div class="group-booking-head">
      <div>
        <div class="eyebrow">Book group coaching</div>
        <h2 id="groupBookingTitle">Private Small Group</h2>
        <p id="groupBookingText">For 2–4 learners. Choose an available time below and complete the booking without leaving Phillips English.</p>
      </div>
    </div>
    <div class="group-book-tabs" role="tablist" aria-label="Choose group coaching type">
      <button class="group-book-tab active" data-group-service="private" type="button">Private Small Group · from £90</button>
      <button class="group-book-tab" data-group-service="team" type="button">Professional Team · from £120</button>
    </div>
    <div class="group-book-summary">
      <span>Selected option</span>
      <strong id="groupBookingSummary">Private Small Group · from £90 / 60 minutes</strong>
      <p>Choose your time in the live calendar below. Booking and payment stay inside this website.</p>
    </div>
    <div class="group-calendar-shell">
      <iframe id="groupCalFrame" title="Group coaching booking calendar" src="https://cal.com/jason-phillips-u5rvya/private-group-coaching" loading="lazy" allow="payment *"></iframe>
    </div>
    <p class="group-book-helper">For a bespoke 8–12 week goal-based programme, use the enquiry form below so I can quote accurately for your group.</p>
  </div>
</section>
'''
              marker = '<section class="group-enquiry" id="group-enquiry">'
              if marker not in s:
                  raise SystemExit('Could not find group enquiry insertion point')
              s = s.replace(marker, section + '\n' + marker, 1)

          # Make sure the selector script updates the visible summary as well as the iframe.
          if "const summary = document.getElementById('groupBookingSummary');" not in s:
              s = s.replace(
                  "const text = document.getElementById('groupBookingText');",
                  "const text = document.getElementById('groupBookingText');\n  const summary = document.getElementById('groupBookingSummary');",
                  1
              )

          # Add price labels to the existing selector data.
          if 'const prices = {' not in s:
              anchor = '  const descriptions = {'
              idx = s.find(anchor)
              if idx == -1:
                  raise SystemExit('Could not find group descriptions block')
              prices = "  const prices = {\n    private: \"Private Small Group · from £90 / 60 minutes\",\n    team: \"Professional Team Coaching · from £120 / 60 minutes\"\n  };\n\n"
              s = s[:idx] + prices + s[idx:]

          if 'summary.textContent = prices[service];' not in s:
              s = s.replace(
                  '    text.textContent = descriptions[service];',
                  '    text.textContent = descriptions[service];\n    if (summary) summary.textContent = prices[service];',
                  1
              )

          p.write_text(s)
          PY

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add group-coaching.html
          if git diff --cached --quiet; then
            echo "No group booking changes needed"
          else
            git commit -m "Fix embedded group coaching booking flow"
            git push
          fi
