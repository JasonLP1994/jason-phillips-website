name: Add blog navigation
on:
  push:
    paths:
      - '.github/workflows/add-blog-navigation.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Blog to main navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          changed=[]
          for p in Path('.').glob('*.html'):
              text=p.read_text()
              m=re.search(r'<nav\b[^>]*>.*?</nav>', text, flags=re.S|re.I)
              if not m:
                  continue
              nav=m.group(0)
              if re.search(r'href=["\']blog\.html["\']', nav, flags=re.I):
                  continue

              patched=nav
              contact=re.search(r'<a\b[^>]*href=["\']contact\.html["\'][^>]*>\s*Contact\s*</a>', nav, flags=re.I)
              if contact:
                  insert='<a href="blog.html">Blog</a>'
                  patched=nav[:contact.start()]+insert+nav[contact.start():]
              else:
                  book=re.search(r'<a\b[^>]*href=["\']book\.html[^"\']*["\'][^>]*>', nav, flags=re.I)
                  if book:
                      patched=nav[:book.start()]+'<a href="blog.html">Blog</a>'+nav[book.start():]

              if patched != nav:
                  text=text[:m.start()]+patched+text[m.end():]
                  p.write_text(text)
                  changed.append(str(p))

          print('Patched:', ', '.join(changed) if changed else 'none')
          PY
      - name: Commit navigation update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add '*.html'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add Blog link to site navigation"
          git push
