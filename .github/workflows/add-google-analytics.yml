name: Add Google Analytics

on:
  push:
    paths:
      - '.github/workflows/add-google-analytics.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-ga:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Refresh GA4 conversion tracking on HTML pages
        shell: python
        run: |
          from pathlib import Path
          import re

          measurement_id = "G-NHQ8S263EP"
          ga_snippet = '''<!-- Google tag (gtag.js) -->
          <script async src="https://www.googletagmanager.com/gtag/js?id=G-NHQ8S263EP"></script>
          <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());
            gtag('config', 'G-NHQ8S263EP');
          </script>
          '''

          event_marker = '<!-- Phillips English GA4 conversion tracking -->'
          event_snippet = r'''<!-- Phillips English GA4 conversion tracking -->
          <script>
          (function () {
            var lastCalEventAt = 0;

            function sendEvent(name, params) {
              if (typeof window.gtag === 'function') {
                window.gtag('event', name, params || {});
              }
            }

            function cleanText(value) {
              return (value || '').replace(/\s+/g, ' ').trim().slice(0, 120);
            }

            function detectOffer(element) {
              var node = element && element.closest ? element.closest('article, section, .card, .booking-card, .route-card, .premium-route, .offer, .pricing-card') : null;
              var text = cleanText((node && node.textContent) || (element && element.textContent) || '').toLowerCase();
              if (text.indexOf('professional english accelerator') !== -1 || text.indexOf('accelerator') !== -1) return 'Professional English Accelerator';
              if (text.indexOf('performance intensive') !== -1 || text.indexOf('intensive') !== -1) return 'Performance Intensive';
              if (text.indexOf('group coaching') !== -1 || text.indexOf('private group') !== -1) return 'Group Coaching';
              if (text.indexOf('private english coaching') !== -1 || text.indexOf('single session') !== -1 || text.indexOf('pay as you go') !== -1) return 'Private English Coaching';
              return '';
            }

            function fireCalBookingClick(element, url) {
              var now = Date.now();
              if (now - lastCalEventAt < 1200) return;
              lastCalEventAt = now;
              sendEvent('cal_booking_click', {
                package_name: detectOffer(element) || 'Private English Coaching',
                link_text: cleanText(element && element.textContent),
                link_url: url || '',
                page_path: window.location.pathname
              });
            }

            document.addEventListener('click', function (event) {
              var target = event.target;
              var link = target && target.closest ? target.closest('a') : null;
              var route = target && target.closest ? target.closest('.premium-route[data-url], [data-url*="cal.com/"]') : null;

              if (route) {
                var routeUrl = route.getAttribute('data-url') || '';
                fireCalBookingClick(route, routeUrl);
                var routeOffer = detectOffer(route);
                if (routeOffer && routeOffer !== 'Private English Coaching') {
                  sendEvent('package_interest', {
                    package_name: routeOffer,
                    link_text: cleanText(route.textContent),
                    link_url: routeUrl,
                    page_path: window.location.pathname
                  });
                }
              }

              if (!link) return;
              var rawHref = link.getAttribute('href') || '';
              var absoluteHref = link.href || rawHref;
              var linkText = cleanText(link.textContent);
              var offer = detectOffer(link);

              if (/book\.html(?:$|[?#])/.test(rawHref) || /\/book(?:\.html)?(?:$|[?#])/.test(absoluteHref)) {
                sendEvent('booking_intent', {
                  link_text: linkText,
                  link_url: absoluteHref,
                  page_path: window.location.pathname
                });
              }

              if (absoluteHref.indexOf('cal.com/') !== -1) {
                fireCalBookingClick(link, absoluteHref);
              }

              if (offer && (offer === 'Professional English Accelerator' || offer === 'Performance Intensive' || offer === 'Group Coaching')) {
                sendEvent('package_interest', {
                  package_name: offer,
                  link_text: linkText,
                  link_url: absoluteHref,
                  page_path: window.location.pathname
                });
              }
            }, true);

            window.addEventListener('blur', function () {
              setTimeout(function () {
                var active = document.activeElement;
                if (!active || active.tagName !== 'IFRAME') return;
                var src = active.getAttribute('src') || '';
                if (src.indexOf('cal.com/') !== -1) {
                  fireCalBookingClick(active, src);
                }
              }, 0);
            });

            document.querySelectorAll('form[action*="formspree.io"]').forEach(function (form) {
              var pending = false;
              var sent = false;
              var status = form.querySelector('.form-status');
              var formName = 'enquiry';
              if (window.location.pathname.indexOf('contact') !== -1) formName = 'contact';
              if (window.location.pathname.indexOf('work-with-me') !== -1) formName = 'work_with_me';
              if (window.location.pathname.indexOf('book') !== -1) formName = 'booking_enquiry';

              form.addEventListener('submit', function () {
                pending = true;
                sent = false;
                if (!status) {
                  setTimeout(function () {
                    if (pending && !sent) {
                      sendEvent('generate_lead', { form_name: formName, page_path: window.location.pathname });
                      sent = true;
                      pending = false;
                    }
                  }, 1500);
                }
              }, true);

              if (status) {
                new MutationObserver(function () {
                  if (!pending || sent) return;
                  var text = (status.textContent || '').toLowerCase();
                  if (text.indexOf('success') !== -1 || text.indexOf('sent') !== -1 || text.indexOf('thank') !== -1) {
                    sendEvent('generate_lead', { form_name: formName, page_path: window.location.pathname });
                    sent = true;
                    pending = false;
                  }
                }).observe(status, { childList: true, subtree: true, characterData: true });
              }
            });

            if (/\/book(?:\.html)?$/.test(window.location.pathname)) {
              sendEvent('view_booking_page', { page_path: window.location.pathname });
            }
          })();
          </script>
          '''

          changed = []
          pattern = re.compile(r'<!-- Phillips English GA4 conversion tracking -->.*?</script>', re.S)

          for path in sorted(Path('.').glob('*.html')):
              text = path.read_text(encoding='utf-8')
              original = text

              if measurement_id not in text:
                  if '<head>' in text:
                      text = text.replace('<head>', '<head>\n' + ga_snippet, 1)
                  elif '</head>' in text:
                      text = text.replace('</head>', ga_snippet + '\n</head>', 1)

              if event_marker in text:
                  text = pattern.sub(lambda m: event_snippet, text, count=1)
              elif '</body>' in text:
                  text = text.replace('</body>', event_snippet + '\n</body>', 1)
              elif '</html>' in text:
                  text = text.replace('</html>', event_snippet + '\n</html>', 1)

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print(f"Updated {len(changed)} HTML files")
          for path in changed:
              print(path)

      - name: Commit Analytics installation
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git commit -m "Improve GA4 booking and lead tracking"
          git push
