name: Add Google Analytics

on:
  push:
    paths:
      - '.github/workflows/add-google-analytics.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-ga:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add GA4 tag to HTML pages
        shell: python
        run: |
          from pathlib import Path

          measurement_id = "G-NHQ8S263EP"
          snippet = '''<!-- Google tag (gtag.js) -->
          <script async src="https://www.googletagmanager.com/gtag/js?id=G-NHQ8S263EP"></script>
          <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());

            gtag('config', 'G-NHQ8S263EP');
          </script>
          '''

          changed = []
          for path in sorted(Path('.').glob('*.html')):
              text = path.read_text(encoding='utf-8')
              if measurement_id in text:
                  continue
              if '<head>' in text:
                  text = text.replace('<head>', '<head>\n' + snippet, 1)
              elif '</head>' in text:
                  text = text.replace('</head>', snippet + '\n</head>', 1)
              else:
                  print(f"Skipping {path}: no <head> section found")
                  continue
              path.write_text(text, encoding='utf-8')
              changed.append(str(path))

          print(f"Updated {len(changed)} HTML files")
          for path in changed:
              print(path)

      - name: Commit Analytics installation
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git commit -m "Install Google Analytics 4 across website"
          git push
