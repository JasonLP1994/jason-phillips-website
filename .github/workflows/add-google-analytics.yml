name: Add Google Analytics

on:
  push:
    paths:
      - '.github/workflows/add-google-analytics.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-ga:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add GA4 tag and conversion tracking to HTML pages
        shell: python
        run: |
          from pathlib import Path

          measurement_id = "G-NHQ8S263EP"
          ga_snippet = '''<!-- Google tag (gtag.js) -->
          <script async src="https://www.googletagmanager.com/gtag/js?id=G-NHQ8S263EP"></script>
          <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());
            gtag('config', 'G-NHQ8S263EP');
          </script>
          '''

          event_marker = '<!-- Phillips English GA4 conversion tracking -->'
          event_snippet = r'''<!-- Phillips English GA4 conversion tracking -->
          <script>
          (function () {
            function sendEvent(name, params) {
              if (typeof window.gtag === 'function') {
                window.gtag('event', name, params || {});
              }
            }

            function cleanText(value) {
              return (value || '').replace(/\s+/g, ' ').trim().slice(0, 120);
            }

            function detectOffer(element) {
              var node = element && element.closest ? element.closest('article, section, .card, .booking-card, .route-card, .offer, .pricing-card') : null;
              var text = cleanText((node && node.textContent) || (element && element.textContent) || '').toLowerCase();
              if (text.indexOf('professional english accelerator') !== -1 || text.indexOf('accelerator') !== -1) return 'Professional English Accelerator';
              if (text.indexOf('performance intensive') !== -1 || text.indexOf('intensive') !== -1) return 'Performance Intensive';
              if (text.indexOf('group coaching') !== -1 || text.indexOf('private group') !== -1) return 'Group Coaching';
              if (text.indexOf('private english coaching') !== -1 || text.indexOf('single session') !== -1 || text.indexOf('pay as you go') !== -1) return 'Private English Coaching';
              return '';
            }

            document.addEventListener('click', function (event) {
              var link = event.target && event.target.closest ? event.target.closest('a') : null;
              if (!link) return;

              var rawHref = link.getAttribute('href') || '';
              var absoluteHref = link.href || rawHref;
              var linkText = cleanText(link.textContent);
              var offer = detectOffer(link);

              if (/book\.html(?:$|[?#])/.test(rawHref) || /\/book(?:\.html)?(?:$|[?#])/.test(absoluteHref)) {
                sendEvent('booking_intent', {
                  link_text: linkText,
                  link_url: absoluteHref,
                  page_path: window.location.pathname
                });
              }

              if (absoluteHref.indexOf('cal.com/') !== -1) {
                sendEvent('cal_booking_click', {
                  package_name: offer || 'Private English Coaching',
                  link_text: linkText,
                  link_url: absoluteHref,
                  page_path: window.location.pathname
                });
              }

              if (offer && (offer === 'Professional English Accelerator' || offer === 'Performance Intensive' || offer === 'Group Coaching')) {
                sendEvent('package_interest', {
                  package_name: offer,
                  link_text: linkText,
                  link_url: absoluteHref,
                  page_path: window.location.pathname
                });
              }
            }, true);

            document.addEventListener('submit', function (event) {
              var form = event.target;
              if (!form || form.tagName !== 'FORM') return;
              var action = form.getAttribute('action') || '';
              if (action.indexOf('formspree.io') === -1) return;

              var formName = 'enquiry';
              if (window.location.pathname.indexOf('contact') !== -1) formName = 'contact';
              if (window.location.pathname.indexOf('work-with-me') !== -1) formName = 'work_with_me';
              if (window.location.pathname.indexOf('book') !== -1) formName = 'booking_enquiry';

              sendEvent('generate_lead', {
                form_name: formName,
                page_path: window.location.pathname
              });
            }, true);

            if (/\/book(?:\.html)?$/.test(window.location.pathname)) {
              sendEvent('view_booking_page', { page_path: window.location.pathname });
            }
          })();
          </script>
          '''

          changed = []
          for path in sorted(Path('.').glob('*.html')):
              text = path.read_text(encoding='utf-8')
              original = text

              if measurement_id not in text:
                  if '<head>' in text:
                      text = text.replace('<head>', '<head>\n' + ga_snippet, 1)
                  elif '</head>' in text:
                      text = text.replace('</head>', ga_snippet + '\n</head>', 1)

              if event_marker not in text:
                  if '</body>' in text:
                      text = text.replace('</body>', event_snippet + '\n</body>', 1)
                  elif '</html>' in text:
                      text = text.replace('</html>', event_snippet + '\n</html>', 1)

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print(f"Updated {len(changed)} HTML files")
          for path in changed:
              print(path)

      - name: Commit Analytics installation
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git commit -m "Add GA4 conversion tracking across website"
          git push
