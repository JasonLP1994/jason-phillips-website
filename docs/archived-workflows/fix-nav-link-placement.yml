name: Fix navigation link placement
'on':
  push:
    paths:
      - .github/workflows/fix-nav-link-placement.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair nav links
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          for page in Path('.').glob('*.html'):
              html = page.read_text(encoding='utf-8')
              original = html

              # Only touch pages using the main .navlinks navigation.
              m = re.search(r'(<div class="navlinks">)(.*?)(</div>)', html, flags=re.S)
              if not m:
                  continue

              before, links, after = m.groups()

              # Remove Blog / Group Coaching anchors that were accidentally inserted
              # as direct children of <nav>, outside .navlinks.
              html = re.sub(r'\s*<a href="blog\.html">Blog</a>', '', html)
              html = re.sub(r'\s*<a href="group-coaching\.html">Group Coaching</a>', '', html)

              # Re-find navlinks after removals.
              m = re.search(r'(<div class="navlinks">)(.*?)(</div>)', html, flags=re.S)
              if not m:
                  continue
              before, links, after = m.groups()

              # Keep the mobile menu clean and predictable.
              desired = [
                  ('index.html','Home'),
                  ('about.html','About'),
                  ('coaching.html','Coaching'),
                  ('results.html','Results'),
                  ('group-coaching.html','Group Coaching'),
                  ('blog.html','Blog'),
                  ('contact.html','Contact'),
              ]
              rebuilt = '\n' + '\n'.join(f'<a href="{href}">{label}</a>' for href,label in desired) + '\n'
              html = html[:m.start()] + before + rebuilt + after + html[m.end():]

              if html != original:
                  page.write_text(html, encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add '*.html'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix Blog and Group Coaching nav placement"
          git push
