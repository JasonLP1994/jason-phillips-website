          <footer><div class="wrap">PHILLIPS ENGLISH · British English &amp; Communication Coach · <a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a> · <a href="cancellation.html">Cancellation</a> · © 2026</div></footer>

          <script>
          (function(){
            const cards=[...document.querySelectorAll('.premium-route')];
            const frame=document.getElementById('calBookingFrame');
            const title=document.getElementById('selectedTitle');
            const summary=document.getElementById('selectedSummary');
            const price=document.getElementById('selectedPrice');
            const coverage=document.getElementById('selectedCoverage');
            const eTitle=document.getElementById('explainerTitle');
            const eText=document.getElementById('explainerText');
            const data={
              single:{title:'Private English Coaching',summary:'Book one 50-minute private coaching session for £45.',price:'£45',coverage:'Includes 1 × 50-minute private session',explainTitle:'Simple pay-as-you-go coaching.',explainText:'Choose any available time below. If you want to continue afterwards, simply book another session when you need it.'},
              accelerator:{title:'Professional English Accelerator',summary:'Start your 12-session professional English programme. The full £495 programme is paid once upfront.',price:'£495',coverage:'Includes all 12 × 50-minute private sessions',explainTitle:'One payment covers the complete 12-session programme.',explainText:'Choose the time for Session 1 below. After your first Zoom session, Jason will arrange Sessions 2–12 with you. They are already included in the programme price.'},
              intensive:{title:'Performance Intensive',summary:'Start your 3-session intensive. The full £225 programme is paid once upfront.',price:'£225',coverage:'Includes all 3 × 50-minute private sessions',explainTitle:'One payment covers all three focused sessions.',explainText:'Choose the time for Session 1 below. Jason will then arrange the remaining two sessions around your deadline and preparation needs.'}
            };
            function activate(card,scroll){
              if(!card) return;
              const key=card.dataset.service;
              const d=data[key];
              cards.forEach(c=>{const on=c===card;c.classList.toggle('active',on);c.setAttribute('aria-selected',on?'true':'false')});
              frame.src=card.dataset.url;
              title.textContent=d.title;summary.textContent=d.summary;price.textContent=d.price;coverage.textContent=d.coverage;eTitle.textContent=d.explainTitle;eText.textContent=d.explainText;
              const url=new URL(window.location.href);url.searchParams.set('service',key);history.replaceState({},'',url.pathname+'?'+url.searchParams.toString()+'#booking');
              if(scroll) document.getElementById('booking').scrollIntoView({behavior:'smooth',block:'start'});
            }
            cards.forEach(card=>card.addEventListener('click',()=>activate(card,true)));
            const requested=new URLSearchParams(location.search).get('service');
            const initial=cards.find(c=>c.dataset.service===requested)||cards[0];
            activate(initial,false);
          })();
          </script>
          '''

          def replace_body(path, body):
              p=Path(path)
              raw=p.read_text()
              marker='<!-- Phillips English GA4 conversion tracking -->'
              if marker not in raw:
                  raise SystemExit(f'Missing GA marker in {path}')
              new=re.sub(r'<body[^>]*>.*?(?='+re.escape(marker)+r')', '<body>\n'+body.strip()+'\n', raw, count=1, flags=re.S|re.I)
              p.write_text(new)

          replace_body('index.html', INDEX_BODY)
          replace_body('book.html', BOOK_BODY)

          # Keep navigation simple across customer-facing and SEO pages.
          for p in Path('.').glob('*.html'):
              raw=p.read_text()
              raw=re.sub(r'\s*<a[^>]+href=["\']book\.html["\'][^>]*>Book</a>', '', raw, flags=re.I)
              raw=re.sub(r'\s*<a[^>]+href=["\']work-with-me\.html["\'][^>]*>Work With Me</a>', '', raw, flags=re.I)
              raw=raw.replace('>Work with Jason<','>Book coaching<')
              p.write_text(raw)
          PY
      - name: Commit customer-first rebuild
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html book.html *.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Rebuild customer journey while preserving SEO depth"
            git push
          fi