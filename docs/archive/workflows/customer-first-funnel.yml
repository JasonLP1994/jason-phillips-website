          BOOK_BODY = r'''
          <div class="wrap">
            <nav>
              <a class="brand" href="index.html"><span class="brand-lockup"><span class="brand-name">Phillips English</span><span class="brand-sub">Private English Coaching</span></span></a>
              <div class="navlinks">
                <a href="index.html">Home</a>
                <a href="coaching.html">Coaching</a>
                <a href="results.html">Results</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
              </div>
              <a class="button navcta" href="#booking">Book coaching</a>
            </nav>
          </div>

          <main>
            <header class="pe-book-hero">
              <div class="wrap">
                <div class="eyebrow">Book private English coaching</div>
                <h1>Choose your coaching. Book your first session.</h1>
                <p>Select the support that fits your goal, then choose a time and complete payment securely in the embedded booking calendar below.</p>
                <div class="pe-book-trust"><span>50-minute sessions</span><span>Live Zoom coaching</span><span>Secure online payment</span><span>13+ years' experience</span></div>
              </div>
            </header>

            <section class="pe-book-options" id="routes">
              <div class="wrap">
                <div class="pe-section-head compact"><div class="eyebrow">Step 1</div><h2>Choose your coaching option.</h2></div>
                <div class="premium-routes pe-book-card-grid">
                  <button aria-selected="true" class="premium-route pe-book-card active" data-service="single" data-url="https://cal.com/jason-phillips-u5rvya/private-english-coaching-single-session" type="button">
                    <span class="pe-kicker">Pay as you go</span><h3>Private English Coaching</h3><p class="route-desc">Focused help with the English you need right now.</p><div class="pe-price">£45</div><div class="route-meta">1 × 50-minute session</div><div class="route-cta">Select &amp; book →</div>
                  </button>
                  <button aria-selected="false" class="premium-route pe-book-card featured" data-service="accelerator" data-url="https://cal.com/jason-phillips-u5rvya/private-english-accelerator" type="button">
                    <span class="pe-kicker">Flagship programme</span><h3>Professional English Accelerator</h3><p class="route-desc">Structured coaching for sustained progress in professional communication, fluency and confidence.</p><div class="pe-price">£495</div><div class="route-meta">12 × 50-minute sessions · paid once upfront</div><div class="route-cta">Select &amp; book →</div>
                  </button>
                  <button aria-selected="false" class="premium-route pe-book-card" data-service="intensive" data-url="https://cal.com/jason-phillips-u5rvya/jason-phillips-u5rvya-performance-intensive" type="button">
                    <span class="pe-kicker">High-stakes preparation</span><h3>Performance Intensive</h3><p class="route-desc">Focused preparation for an interview, presentation, assessment or important deadline.</p><div class="pe-price">£225</div><div class="route-meta">3 × 50-minute sessions · paid once upfront</div><div class="route-cta">Select &amp; book →</div>
                  </button>
                </div>
              </div>
            </section>

            <section class="booking-stage pe-booking-stage" id="booking">
              <div class="wrap">
                <div class="pe-booking-head">
                  <div><div class="eyebrow">Step 2 · Live availability</div><h2 id="selectedTitle">Private English Coaching</h2><p id="selectedSummary">Book one 50-minute private coaching session for £45.</p></div>
                  <div class="purchase-summary pe-purchase-summary"><span>Due at booking</span><strong id="selectedPrice">£45</strong><small id="selectedCoverage">Includes 1 × 50-minute private session</small></div>
                </div>
                <div class="pe-book-explainer"><strong id="explainerTitle">Simple pay-as-you-go coaching.</strong><p id="explainerText">Choose any available time below. If you want to continue afterwards, simply book another session when you need it.</p></div>
                <div class="premium-calendar-shell pe-calendar-shell">
                  <iframe id="calBookingFrame" src="https://cal.com/jason-phillips-u5rvya/private-english-coaching-single-session" title="Phillips English secure booking calendar" loading="eager" allow="payment *"></iframe>
                </div>
                <p class="pe-booking-note">You stay on Phillips English while choosing your time and completing payment. Package clients book Session 1 now; after that first Zoom session, Jason arranges the remaining sessions with you. Those sessions are already included in the package price.</p>
              </div>
            </section>

            <section class="pe-book-help">
              <div class="wrap pe-help-grid">
                <div><div class="eyebrow">Not sure which option fits?</div><h2>Start with your goal.</h2></div>
                <div><p><strong>Choose Private Coaching</strong> if you want flexible, focused support one session at a time.</p><p><strong>Choose the Accelerator</strong> if you want a structured programme and sustained improvement over 12 sessions.</p><p><strong>Choose the Intensive</strong> if you have an interview, presentation, assessment or deadline coming up soon.</p><p>For teams and small groups, <a href="group-coaching.html">view Group Coaching</a>.</p></div>
              </div>
            </section>
