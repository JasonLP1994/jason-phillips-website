name: Repair booking and contrast
'on':
  push:
    paths:
      - .github/workflows/fix-group-booking-contact-contrast.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          page = Path('group-coaching.html')
          html = page.read_text()
          if 'id="group-booking"' not in html:
              target = '<section class="group-enquiry" id="group-enquiry">'
              block = '''<section class="group-booking" id="group-booking">
          <div class="wrap">
          <div class="group-booking-head"><div><div class="eyebrow">Book group coaching</div><h2>Choose your group format and book here.</h2><p>Select your option, then choose a date and time in the live calendar below. The booking stays inside Phillips English.</p></div></div>
          <div class="group-book-tabs" role="tablist" aria-label="Group coaching options">
          <button class="group-book-tab active" data-group-service="private" type="button">Private Small Group</button>
          <button class="group-book-tab" data-group-service="team" type="button">Professional Team Coaching</button>
          </div>
          <div class="group-book-summary"><span>Your selection</span><strong id="groupBookingTitle">Private Small Group</strong><p id="groupBookingText">For 2–4 learners. Choose an available time below and continue through the booking flow.</p></div>
          <div class="group-calendar-shell"><iframe id="groupCalFrame" title="Book group English coaching" src="https://cal.com/jason-phillips-u5rvya/private-group-coaching" loading="lazy" allow="payment *"></iframe></div>
          <p class="group-book-helper">Choose a date and time above. For a bespoke programme, use the enquiry form below.</p>
          </div>
          </section>

          '''
              if target not in html:
                  raise SystemExit('group enquiry target not found')
              html = html.replace(target, block + target, 1)
              page.write_text(html)

          css = Path('assets/site-polish.css')
          styles = css.read_text()
          flag = '/* Contact featured-card contrast safeguard */'
          if flag not in styles:
              styles += '''

          /* Contact featured-card contrast safeguard */
          .contact-grid-section .contact-card.featured,
          .contact-grid-section .contact-card.featured h1,
          .contact-grid-section .contact-card.featured h2,
          .contact-grid-section .contact-card.featured h3,
          .contact-grid-section .contact-card.featured p,
          .contact-grid-section .contact-card.featured strong,
          .contact-grid-section .contact-card.featured li,
          .contact-grid-section .contact-card.featured .email,
          .contact-grid-section .contact-card.featured a{color:#fff!important}
          .contact-grid-section .contact-card.featured .label{color:var(--pe-aqua)!important}
          '''
              css.write_text(styles)
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add group-coaching.html assets/site-polish.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Restore embedded group booking and fix contact contrast"
          git push
