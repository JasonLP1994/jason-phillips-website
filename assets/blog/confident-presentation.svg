<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
<title id="t">Confident English presentation guide</title><desc id="d">Phillips English visual guide to giving confident presentations in English.</desc>
<defs><linearGradient id="g2" x1="0" x2="1"><stop stop-color="#071521"/><stop offset="1" stop-color="#1d6174"/></linearGradient></defs>
<rect width="1200" height="675" fill="#f5f2eb"/><rect width="1200" height="675" fill="url(#g2)" opacity=".07"/>
<text x="70" y="82" fill="#102330" font-family="Arial,sans-serif" font-size="31" font-weight="800" letter-spacing="4">PHILLIPS ENGLISH</text>
<rect x="70" y="118" width="90" height="8" rx="4" fill="#67d8f6"/>
<text x="70" y="220" fill="#102330" font-family="Arial,sans-serif" font-size="60" font-weight="800">Give a confident</text>
<text x="70" y="288" fill="#102330" font-family="Arial,sans-serif" font-size="60" font-weight="800">presentation in English.</text>
<text x="70" y="344" fill="#50646d" font-family="Arial,sans-serif" font-size="25">10 practical techniques for clearer, calmer professional speaking.</text>
<g transform="translate(70 402)"><rect width="245" height="116" rx="18" fill="#fff" stroke="#c9dce4"/><text x="24" y="42" fill="#236779" font-family="Arial" font-size="18" font-weight="700">1. STRUCTURE</text><text x="24" y="78" fill="#102330" font-family="Arial" font-size="22" font-weight="700">Know your route.</text></g>
<g transform="translate(332 402)"><rect width="245" height="116" rx="18" fill="#fff" stroke="#c9dce4"/><text x="24" y="42" fill="#236779" font-family="Arial" font-size="18" font-weight="700">2. LANGUAGE</text><text x="24" y="78" fill="#102330" font-family="Arial" font-size="22" font-weight="700">Use useful phrases.</text></g>
<g transform="translate(594 402)"><rect width="245" height="116" rx="18" fill="#fff" stroke="#c9dce4"/><text x="24" y="42" fill="#236779" font-family="Arial" font-size="18" font-weight="700">3. PRACTICE</text><text x="24" y="78" fill="#102330" font-family="Arial" font-size="22" font-weight="700">Rehearse aloud.</text></g>
<g transform="translate(856 402)"><rect width="245" height="116" rx="18" fill="#fff" stroke="#c9dce4"/><text x="24" y="42" fill="#236779" font-family="Arial" font-size="18" font-weight="700">4. QUESTIONS</text><text x="24" y="78" fill="#102330" font-family="Arial" font-size="22" font-weight="700">Prepare to respond.</text></g>
<text x="70" y="606" fill="#236779" font-family="Arial,sans-serif" font-size="24" font-weight="800">Practical Business English for the moments that matter.</text>
