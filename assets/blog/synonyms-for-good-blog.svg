<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#071521"/><circle cx="1280" cy="190" r="230" fill="#102b3e"/><circle cx="1360" cy="240" r="125" fill="#8bc8ef" opacity=".24"/><text x="110" y="140" fill="#8bc8ef" font-family="Arial" font-size="28" font-weight="700" letter-spacing="5">PHILLIPS ENGLISH · VOCABULARY</text><text x="110" y="285" fill="#f5f2eb" font-family="Georgia" font-size="98" font-weight="700">Stop saying “good”</text><text x="110" y="390" fill="#f5f2eb" font-family="Georgia" font-size="98">for everything.</text><g font-family="Arial" font-size="30" font-weight="700"><rect x="110" y="500" rx="30" width="230" height="70" fill="#dcebed"/><text x="155" y="545" fill="#10252d">effective</text><rect x="365" y="500" rx="30" width="230" height="70" fill="#dcebed"/><text x="410" y="545" fill="#10252d">valuable</text><rect x="620" y="500" rx="30" width="230" height="70" fill="#dcebed"/><text x="665" y="545" fill="#10252d">promising</text><rect x="875" y="500" rx="30" width="230" height="70" fill="#dcebed"/><text x="920" y="545" fill="#10252d">impressive</text></g><text x="110" y="690" fill="#b9c8d1" font-family="Arial" font-size="34">Choose the word that explains why something is good.</text><path d="M118 760 H640" stroke="#8bc8ef" stroke-width="5"/><text x="110" y="825" fill="#f5f2eb" font-family="Arial" font-size="30" font-weight="700">Better vocabulary. Clearer meaning.</text></svg>