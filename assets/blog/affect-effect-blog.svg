<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#071521"/><text x="100" y="120" fill="#8bc8ef" font-family="Arial" font-size="27" font-weight="700" letter-spacing="5">PHILLIPS ENGLISH · WORD CHOICE</text><text x="100" y="275" fill="#f5f2eb" font-family="Georgia" font-size="108">Affect vs Effect</text><text x="100" y="350" fill="#b8c7d0" font-family="Arial" font-size="34">The action and the result.</text><rect x="100" y="445" width="630" height="295" rx="28" fill="#dcebed"/><text x="155" y="530" fill="#10252d" font-family="Georgia" font-size="62">Affect</text><text x="155" y="590" fill="#35616b" font-family="Arial" font-size="28" font-weight="700">USUALLY A VERB</text><text x="155" y="660" fill="#10252d" font-family="Arial" font-size="31">The change affected sales.</text><rect x="870" y="445" width="630" height="295" rx="28" fill="#f5f2eb"/><text x="925" y="530" fill="#10252d" font-family="Georgia" font-size="62">Effect</text><text x="925" y="590" fill="#35616b" font-family="Arial" font-size="28" font-weight="700">USUALLY A NOUN</text><text x="925" y="660" fill="#10252d" font-family="Arial" font-size="31">It had an effect on sales.</text><path d="M765 590 H835" stroke="#8bc8ef" stroke-width="8"/><path d="M812 565 L840 590 L812 615" fill="none" stroke="#8bc8ef" stroke-width="8"/></svg>