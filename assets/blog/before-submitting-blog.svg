<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#081724"/><rect x="0" y="0" width="610" height="900" fill="#0f2a3c"/><text x="90" y="130" fill="#8bc8ef" font-family="Arial" font-size="27" font-weight="700" letter-spacing="5">PHILLIPS ENGLISH · GRAMMAR</text><text x="90" y="300" fill="#f5f2eb" font-family="Georgia" font-size="94">Before submit?</text><line x1="95" y1="340" x2="505" y2="340" stroke="#df7f72" stroke-width="10"/><text x="90" y="510" fill="#8bc8ef" font-family="Georgia" font-size="94">Before submitting.</text><line x1="95" y1="550" x2="555" y2="550" stroke="#8bc8ef" stroke-width="10"/><rect x="735" y="145" width="690" height="610" rx="34" fill="#f5f2eb"/><text x="805" y="245" fill="#10252d" font-family="Arial" font-size="31" font-weight="700">The useful pattern</text><text x="805" y="350" fill="#10252d" font-family="Georgia" font-size="48">before + verb-ing</text><text x="805" y="430" fill="#5c6f78" font-family="Arial" font-size="29">Please check the details</text><text x="805" y="478" fill="#5c6f78" font-family="Arial" font-size="29">before submitting the request.</text><path d="M805 545 H1310" stroke="#c7d6da" stroke-width="3"/><text x="805" y="625" fill="#10252d" font-family="Georgia" font-size="39">or</text><text x="875" y="625" fill="#10252d" font-family="Georgia" font-size="39">before + subject + verb</text><text x="805" y="700" fill="#5c6f78" font-family="Arial" font-size="28">before you submit the request</text></svg>