<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#071521"/><text x="100" y="120" fill="#8bc8ef" font-family="Arial" font-size="27" font-weight="700" letter-spacing="5">PHILLIPS ENGLISH · PREPOSITIONS</text><text x="100" y="290" fill="#f5f2eb" font-family="Georgia" font-size="112">In, On or At?</text><text x="100" y="365" fill="#b8c7d0" font-family="Arial" font-size="34">Think about size and focus.</text><g font-family="Arial"><rect x="100" y="470" width="410" height="220" rx="28" fill="#dcebed"/><text x="150" y="555" fill="#10252d" font-family="Georgia" font-size="72">At</text><text x="150" y="610" fill="#35616b" font-size="28" font-weight="700">A POINT</text><text x="150" y="655" fill="#10252d" font-size="27">at 9:00 · at reception</text><rect x="595" y="470" width="410" height="220" rx="28" fill="#f5f2eb"/><text x="645" y="555" fill="#10252d" font-family="Georgia" font-size="72">On</text><text x="645" y="610" fill="#35616b" font-size="28" font-weight="700">A DAY OR SURFACE</text><text x="645" y="655" fill="#10252d" font-size="27">on Monday · on the desk</text><rect x="1090" y="470" width="410" height="220" rx="28" fill="#dcebed"/><text x="1140" y="555" fill="#10252d" font-family="Georgia" font-size="72">In</text><text x="1140" y="610" fill="#35616b" font-size="28" font-weight="700">A PERIOD OR PLACE</text><text x="1140" y="655" fill="#10252d" font-size="27">in October · in London</text></g><path d="M100 770 H1495" stroke="#28485c" stroke-width="3"/><text x="100" y="825" fill="#8bc8ef" font-family="Arial" font-size="31" font-weight="700">Small words. Big difference.</text></svg>