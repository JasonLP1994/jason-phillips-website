<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">Small change, big impact: English contractions</title>
<desc id="desc">Examples showing I was not sure becoming I wasn't sure, She did not call becoming She didn't call, and We are ready becoming We're ready.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fbfb"/><stop offset="1" stop-color="#e5f1f3"/></linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#edf7f9"/><stop offset="1" stop-color="#dcecee"/></linearGradient>
</defs>
<rect width="1440" height="900" fill="url(#bg)"/>
<path d="M0 785 C260 720 420 860 680 805 C930 755 1110 675 1440 730 V900 H0Z" fill="#d7edf0"/>
<text x="720" y="145" text-anchor="middle" font-family="Georgia,serif" font-size="82" font-weight="700" fill="#111b33">Small change. <tspan fill="#356ca9">Big impact.</tspan></text>
<text x="720" y="215" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" fill="#1d2930">Contractions make your English sound more <tspan font-weight="700" fill="#2a629c">natural</tspan> and <tspan font-weight="700" fill="#2a629c">fluent</tspan>.</text>
<g transform="translate(60 300)">
  <rect width="410" height="360" rx="28" fill="url(#card)"/>
  <rect x="42" y="50" width="326" height="92" rx="46" fill="#fff"/><text x="205" y="108" text-anchor="middle" font-family="Georgia,serif" font-size="31" font-weight="700" fill="#111b33">I was not sure.</text>
  <path d="M205 166 v52" stroke="#4aa0a7" stroke-width="9" stroke-linecap="round"/><path d="M189 207 l16 18 16-18" fill="none" stroke="#4aa0a7" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="42" y="242" width="326" height="92" rx="46" fill="#d9eeea"/><text x="205" y="300" text-anchor="middle" font-family="Georgia,serif" font-size="31" fill="#111b33">I <tspan font-family="Arial,sans-serif" font-weight="800" fill="#2a629c">wasn't</tspan> sure.</text>
</g>
<g transform="translate(515 300)">
  <rect width="410" height="360" rx="28" fill="url(#card)"/>
  <rect x="42" y="50" width="326" height="92" rx="46" fill="#fff"/><text x="205" y="108" text-anchor="middle" font-family="Georgia,serif" font-size="31" font-weight="700" fill="#111b33">She did not call.</text>
  <path d="M205 166 v52" stroke="#4aa0a7" stroke-width="9" stroke-linecap="round"/><path d="M189 207 l16 18 16-18" fill="none" stroke="#4aa0a7" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="42" y="242" width="326" height="92" rx="46" fill="#d9eeea"/><text x="205" y="300" text-anchor="middle" font-family="Georgia,serif" font-size="31" fill="#111b33">She <tspan font-family="Arial,sans-serif" font-weight="800" fill="#2a629c">didn't</tspan> call.</text>
</g>
<g transform="translate(970 300)">
  <rect width="410" height="360" rx="28" fill="url(#card)"/>
  <rect x="42" y="50" width="326" height="92" rx="46" fill="#fff"/><text x="205" y="108" text-anchor="middle" font-family="Georgia,serif" font-size="31" font-weight="700" fill="#111b33">We are ready.</text>
  <path d="M205 166 v52" stroke="#4aa0a7" stroke-width="9" stroke-linecap="round"/><path d="M189 207 l16 18 16-18" fill="none" stroke="#4aa0a7" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="42" y="242" width="326" height="92" rx="46" fill="#d9eeea"/><text x="205" y="300" text-anchor="middle" font-family="Georgia,serif" font-size="31" fill="#111b33"><tspan font-family="Arial,sans-serif" font-weight="800" fill="#2a629c">We're</tspan> ready.</text>
</g>
<text x="720" y="760" text-anchor="middle" font-family="Arial,sans-serif" font-size="38" fill="#111b33">Simple, <tspan font-weight="700" fill="#2a629c">natural</tspan>, confident English.</text>
</svg>